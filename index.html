<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aung Business Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e5eaf1;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#dc2626;
  --premium:#7c3aed;
  --shadow:0 8px 30px rgba(15,23,42,.07);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Myanmar",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:255px;
  background:#111827;
  color:white;
  z-index:1000;
  overflow-y:auto;
}

.logo{
  padding:22px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo h1{
  font-size:19px;
  margin-bottom:5px;
}

.logo p{
  color:#94a3b8;
  font-size:12px;
}

.profile{
  padding:18px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.profile-name{
  font-weight:700;
}

.profile-role{
  color:#94a3b8;
  font-size:12px;
  margin-top:4px;
}

.nav{
  padding:15px 10px;
}

.nav-section{
  color:#64748b;
  font-size:10px;
  text-transform:uppercase;
  padding:12px 12px 7px;
  letter-spacing:1px;
}

.nav button{
  width:100%;
  text-align:left;
  background:transparent;
  color:#cbd5e1;
  padding:11px 13px;
  border-radius:9px;
  margin-bottom:3px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:#1e40af;
  color:white;
}

.sidebar-status{
  margin:15px;
  padding:13px;
  border-radius:12px;
  background:linear-gradient(135deg,#312e81,#7c3aed);
}

.sidebar-status strong{
  display:block;
  font-size:13px;
}

.sidebar-status span{
  display:block;
  font-size:11px;
  color:#ddd6fe;
  margin-top:4px;
}

/* MAIN */

.main{
  margin-left:255px;
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
}

.topbar h2{
  font-size:21px;
}

.menu-btn{
  display:none;
  background:#eff6ff;
  padding:9px 11px;
  border-radius:8px;
}

.top-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.premium-badge{
  background:#f3e8ff;
  color:#7e22ce;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.container{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

/* COMMON */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  gap:18px;
}

.grid-4{
  grid-template-columns:repeat(4,1fr);
}

.grid-3{
  grid-template-columns:repeat(3,1fr);
}

.grid-2{
  grid-template-columns:repeat(2,1fr);
}

.stat{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.stat-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eff6ff;
  font-size:20px;
}

.stat h3{
  font-size:26px;
  margin-top:9px;
}

.stat p{
  color:var(--muted);
  font-size:13px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 0 15px;
}

.section-title h3{
  font-size:18px;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.btn{
  padding:10px 16px;
  border-radius:9px;
  font-weight:700;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-light{
  background:#f1f5f9;
  color:#334155;
}

.btn-premium{
  background:linear-gradient(135deg,#7c3aed,#9333ea);
  color:white;
}

.btn-danger{
  background:#fee2e2;
  color:#991b1b;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#1d4ed8,#2563eb 50%,#7c3aed);
  color:white;
  border-radius:20px;
  padding:30px;
  margin-bottom:20px;
}

.hero h1{
  font-size:28px;
  margin-bottom:8px;
}

.hero p{
  color:#dbeafe;
  max-width:720px;
  line-height:1.7;
}

.hero-actions{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hero .btn-light{
  background:white;
  color:#1d4ed8;
}

/* COURSES */

.course-card{
  position:relative;
  overflow:hidden;
}

.course-icon{
  font-size:32px;
  margin-bottom:13px;
}

.course-card h3{
  font-size:16px;
  margin-bottom:7px;
}

.course-card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  min-height:38px;
}

.course-meta{
  display:flex;
  justify-content:space-between;
  margin:15px 0 10px;
  color:var(--muted);
  font-size:11px;
}

.progress{
  height:7px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,#2563eb,#7c3aed);
  border-radius:10px;
}

.course-bottom{
  margin-top:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.lock{
  color:#7c3aed;
  font-size:13px;
  font-weight:700;
}

/* LESSONS */

.lesson-list{
  display:grid;
  gap:10px;
}

.lesson-item{
  display:flex;
  align-items:center;
  gap:13px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  background:white;
}

.lesson-number{
  min-width:38px;
  width:38px;
  height:38px;
  border-radius:10px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.lesson-info{
  flex:1;
}

.lesson-info strong{
  font-size:14px;
}

.lesson-info p{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.completed{
  background:#dcfce7;
  color:#15803d;
}

.locked{
  opacity:.72;
}

/* PREMIUM */

.premium-card{
  background:linear-gradient(135deg,#312e81,#7c3aed);
  color:white;
  border-radius:18px;
  padding:25px;
  position:relative;
  overflow:hidden;
}

.premium-card h2{
  font-size:22px;
  margin-bottom:8px;
}

.premium-card p{
  color:#ede9fe;
  line-height:1.6;
}

.plans{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:20px;
}

.plan{
  background:white;
  color:var(--text);
  border-radius:15px;
  padding:22px;
  border:2px solid transparent;
}

.plan.featured{
  border-color:#a78bfa;
}

.plan h3{
  margin-bottom:7px;
}

.price{
  font-size:26px;
  font-weight:800;
  margin:12px 0;
}

.plan ul{
  list-style:none;
  margin:15px 0;
}

.plan li{
  font-size:13px;
  margin:9px 0;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.65);
  z-index:3000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  background:white;
  border-radius:18px;
  width:min(900px,100%);
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.modal-head{
  padding:20px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  position:sticky;
  top:0;
  background:white;
  z-index:2;
}

.close{
  width:36px;
  height:36px;
  border-radius:8px;
  background:#f1f5f9;
}

.modal-body{
  padding:25px;
}

/* LESSON CONTENT */

.lesson-content{
  line-height:1.9;
  font-size:14px;
}

.lesson-content h3{
  color:#1e40af;
  margin:25px 0 9px;
  font-size:17px;
}

.lesson-content h4{
  margin:16px 0 7px;
  color:#334155;
}

.lesson-content p{
  margin-bottom:10px;
}

.lesson-content ul,
.lesson-content ol{
  padding-left:22px;
  margin-bottom:12px;
}

.lesson-content li{
  margin-bottom:7px;
}

.info-box{
  background:#eff6ff;
  border-left:4px solid #2563eb;
  padding:14px 16px;
  border-radius:8px;
  margin:14px 0;
}

.warning-box{
  background:#fff7ed;
  border-left:4px solid #f59e0b;
  padding:14px 16px;
  border-radius:8px;
  margin:14px 0;
}

.success-box{
  background:#f0fdf4;
  border-left:4px solid #16a34a;
  padding:14px 16px;
  border-radius:8px;
  margin:14px 0;
}

.quiz{
  background:#f8fafc;
  border:1px solid var(--border);
  padding:18px;
  border-radius:12px;
  margin-top:18px;
}

.quiz-option{
  display:block;
  background:white;
  border:1px solid var(--border);
  padding:11px;
  border-radius:8px;
  margin-top:8px;
}

.quiz-option:hover{
  border-color:#2563eb;
}

/* FORMS */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  margin-bottom:14px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  background:white;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#2563eb;
}

/* CALCULATOR */

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tab{
  padding:9px 13px;
  background:#f1f5f9;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}

.tab.active{
  background:#2563eb;
  color:white;
}

.result{
  background:#eff6ff;
  border-radius:12px;
  padding:20px;
  margin-top:15px;
}

.result strong{
  display:block;
  font-size:28px;
  color:#1d4ed8;
  margin-top:6px;
}

/* AI */

.ai-chat{
  display:grid;
  gap:12px;
}

.ai-message{
  padding:15px;
  border-radius:13px;
  max-width:90%;
  line-height:1.8;
}

.ai-user{
  background:#dbeafe;
  margin-left:auto;
}

.ai-bot{
  background:white;
  border:1px solid var(--border);
}

.ai-input{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.ai-input input{
  flex:1;
  border:1px solid #dbe2ea;
  border-radius:10px;
  padding:12px;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{
  background:#f8fafc;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:13px 17px;
  border-radius:10px;
  display:none;
  z-index:5000;
  max-width:330px;
  font-size:13px;
}

.toast.show{
  display:block;
}

/* MOBILE */

@media(max-width:1000px){
  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 14px;
  }

  .topbar h2{
    font-size:17px;
  }

  .container{
    padding:15px;
  }

  .grid-4,
  .grid-3,
  .grid-2,
  .plans,
  .form-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:22px;
  }

  .stat h3{
    font-size:22px;
  }

  .lesson-item{
    padding:11px;
  }

  .lesson-info p{
    display:none;
  }

  .modal-body{
    padding:17px;
  }
}
</style>
</head>

</header>

<div class="container" id="appContent"></div>

</main>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="closeModalOutside(event)">

    <div class="modal-head">

    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

/* ---------- STORAGE ---------- */

const STORAGE = {
 completed:"ABA_PRO_COMPLETED",
 subscription:"ABA_PRO_SUBSCRIPTION",
 cv:"ABA_PRO_CV",
 settings:"ABA_PRO_SETTINGS"
};

let completed = JSON.parse(localStorage.getItem(STORAGE.completed) || "[]");

let subscription = JSON.parse(
  localStorage.getItem(STORAGE.subscription) || '{"plan":"free","expires":null}'
);

let cvData = JSON.parse(
  localStorage.getItem(STORAGE.cv) || "{}"
);

let settings = JSON.parse(
  localStorage.getItem(STORAGE.settings) ||
  '{"name":"Aung Zar Ni Win","role":"Business Manager"}'
);

/* ---------- HELPERS ---------- */

function saveAll(){
  localStorage.setItem(STORAGE.completed,JSON.stringify(completed));
  localStorage.setItem(STORAGE.subscription,JSON.stringify(subscription));
  localStorage.setItem(STORAGE.cv,JSON.stringify(cvData));
  localStorage.setItem(STORAGE.settings,JSON.stringify(settings));
}

function isPremium(){

  if(!subscription || subscription.plan==="free"){
    return false;
  }

  if(!subscription.expires){
    return false;
  }

  return new Date(subscription.expires).getTime() > Date.now();
}

function daysLeft(){

  if(!isPremium()) return 0;

  const diff =
    new Date(subscription.expires).getTime() - Date.now();

  return Math.ceil(diff/(1000*60*60*24));
}

function totalLessons(){

  return COURSES.reduce((sum,c)=>sum+c[2],0);
}

function totalCompleted(){

  return completed.length;
}

function courseCompleted(courseId){

  return completed.filter(x=>x.startsWith(courseId+"-")).length;
}

function percent(courseId){

  const course = COURSES.find(c=>c[0]===courseId);

  if(!course) return 0;

  return Math.round(
    courseCompleted(courseId)/course[2]*100
  );
}

function toast(message){

  const el=document.getElementById("toast");

  el.innerText=message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2800);
}

function escapeHtml(text){

  return String(text || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

/* ---------- SUBSCRIPTION ---------- */

function planName(){

  if(!isPremium()) return "🆓 Free Plan";

  if(subscription.plan==="1month"){
    return "⭐ Premium • 1 Month";
  }

  if(subscription.plan==="6month"){
    return "👑 Premium • 6 Months";
  }

  return "🆓 Free Plan";
}

function updateSubscriptionUI(){

  document.getElementById("topPlan").innerText =
    isPremium()
    ? (subscription.plan==="1month" ? "⭐ 1 Month Premium" : "👑 6 Months Premium")
    : "🆓 Free";

  document.getElementById("sidePlan").innerText =
    planName();

  document.getElementById("sideExpiry").innerText =
    isPremium()
    ? `${daysLeft()} days remaining`
    : "Lesson 1 Free";
}

/* ---------- NAVIGATION ---------- */

function showPage(page){

  currentPage=page;

  document.querySelectorAll(".nav button").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page===page
    );
  });

  const titles={
    dashboard:"Dashboard",
    courses:"My Courses",
    lessons:"Lessons",
    progress:"My Progress",
    sales:"Sales Manager",
    calculator:"Pricing & KPI",
    reports:"Reports",
    tools:"Manager Tools",
    cv:"Professional CV Builder",
    interview:"Interview Coach",
    ai:"AI Business Coach",
    aitools:"AI Tools",
    subscription:"Premium Subscription",
    settings:"Settings"
  };

  document.getElementById("pageTitle").innerText =
    titles[page] || "Aung Business Academy";

  render();

  window.scrollTo({top:0,behavior:"smooth"});

  if(window.innerWidth<=760){
    document.getElementById("sidebar").classList.remove("open");
  }
}

function toggleSidebar(){

  document.getElementById("sidebar").classList.toggle("open");
}

  updateSubscriptionUI();

  const content=document.getElementById("appContent");

  const pages={
    dashboard:renderDashboard,
    courses:renderCourses,
    lessons:renderLessons,
    progress:renderProgress,

    cv:renderCV,
    interview:renderInterview,
    ai:renderAI,

  if(no>1 && !isPremium()){

    showSubscriptionModal();

    return;
  }

  const topic=(TOPICS[courseId]||[])[no-1];

  const content=createDetailedLesson(course,topic,no);

  document.getElementById("modalTitle").innerText =
    `${course[1]} • Lesson ${no}`;

  document.getElementById("modalBody").innerHTML =
    content;

  document.getElementById("modalBg").classList.add("show");
}

function answerQuiz(button,correct){

  if(correct){

    button.style.borderColor="#16a34a";
    button.style.background="#dcfce7";

    toast("🎉 Correct Answer!");

  }else{

    button.style.borderColor="#dc2626";
    button.style.background="#fee2e2";

    toast("Try again. Review the Core Concept.");

  }
}

/* ---------- LESSON COMPLETE ---------- */

function completeLesson(courseId,no){

  const key=courseId+"-"+no;

  if(!completed.includes(key)){

    completed.push(key);

    saveAll();

    toast("✅ Lesson completed!");

  }

  closeModal();

  render();

}

function nextLesson(courseId,no){

  closeModal();

  const course=COURSES.find(c=>c[0]===courseId);

  if(!course) return;

  if(no+1>course[2]){

    toast("🎉 Course completed!");

    return;
  }

  if(no+1>1 && !isPremium()){

    showSubscriptionModal();

    return;
  }

  openLesson(courseId,no+1);
}

    </button>

    `;

  }

  if(calcTab==="target"){

        <input id="tTarget" type="number">

    </button>

    `;

  }

function number(id){

  return Number(document.getElementById(id)?.value || 0);
}

function showCalcResult(title,value){

  document.getElementById("calcResult").innerHTML=`

    <div class="result">
      ${title}
      <strong>${value}</strong>
    </div>

  `;
}

function calcMargin(){

  const revenue=number("mRevenue");
  const cost=number("mCost");

  if(revenue<=0){

    toast("Enter valid revenue.");

    return;
  }

  const margin=(revenue-cost)/revenue*100;

  showCalcResult("Gross Margin",margin.toFixed(2)+"%");
}

function calcProfit(){

  const revenue=number("pRevenue");
  const cost=number("pCost");

  showCalcResult("Profit",(revenue-cost).toLocaleString()+" MMK");
}

function calcBreakEven(){

  const fixed=number("bFixed");
  const price=number("bPrice");
  const variable=number("bVariable");

  const contribution=price-variable;

  if(contribution<=0){

    toast("Price must be greater than variable cost.");

    return;
  }

  const units=fixed/contribution;

  showCalcResult("Break-even Units",units.toFixed(2));
}

function calcTarget(){

  const target=number("tTarget");
  const days=number("tDays");

  if(days<=0){

    toast("Enter valid working days.");

    return;
  }

  showCalcResult(
    "Daily Sales Target",
    (target/days).toLocaleString()+" MMK"
  );
}

function calcKPI(){

  const target=number("kTarget");
  const actual=number("kActual");

  if(target<=0){

    toast("Enter valid target.");

    return;
  }

  const achievement=actual/target*100;

  showCalcResult(
    "Target Achievement",
    achievement.toFixed(2)+"%"
  );
}

function easyMyanmar(question){

  if(question.includes("yourself"))
    return "ကိုယ့် Experience + Strength + Result ကို အတိုချုပ်ပြောပါ။";

  if(question.includes("responsibilities"))
    return "Target + Team + Customer + KPI + Forecast + Review.";

  if(question.includes("underperforming"))
    return "Root Cause → Expectation → Coaching → Action Plan → Review.";

  if(question.includes("targets"))
    return "Target ကို People + Territory + Channel + Customer အဖြစ် ခွဲပြီး KPI နဲ့ Follow-up လုပ်ပါ။";

  if(question.includes("customer"))
    return "နားထောင် → အကြောင်းရင်းရှာ → Solution → Value နဲ့ညှိနှိုင်း.";

  if(question.includes("forecast"))
    return "History + Pipeline + Customer Plan + Stock + Market Trend.";

  if(question.includes("leadership"))
    return "Clear Expectation + Ownership + Coaching + Feedback.";

  if(question.includes("hire"))
    return "Experience + Field Knowledge + Leadership + Results.";

  if(question.includes("price"))
    return "Price တစ်ခုတည်းမဟုတ်ဘဲ Value + Trade-off + Relationship.";

  return "Growth mindset + Business Result + Leadership.";
}

    <strong>Problem → ကိုယ်ဘာလုပ် → Result</strong>

  }

  if(
    lower.includes("sales") ||
    lower.includes("target") ||
    lower.includes("အရောင်း")
  ){

    return `

    <strong>🎯 Sales Target မရတဲ့အခါ Manager လုပ်ရမယ့်အဆင့်များ</strong><br><br>

    <strong>2. Data ကိုခွဲပါ</strong><br>
    Territory, Salesperson, Channel, Customer,

    <strong>3. Root Cause ရှာပါ</strong><br>

    <strong>6. Weekly Review</strong><br>
    Result မရတဲ့အခါ လူကိုအပြစ်တင်တာထက်
    Process နဲ့ Execution Gap ကိုရှာပြီး ပြန်ပြင်ပါ။

    <br><br>

    <strong>Manager Principle:</strong><br>
    Target ကို စာရွက်ပေါ်က Number အဖြစ်မထားဘဲ
    People + Territory + Customer + Activity
    အဖြစ် ပြောင်းပြီး Manage လုပ်ရပါတယ်။
    `;

  }

  if(
    lower.includes("negotiation") ||
    lower.includes("ညှိနှိုင်း") ||
    lower.includes("price")
  ){

    return `

    <strong>🤝 Professional Negotiation Framework</strong><br><br>

    <br><br>

    <strong>2. Minimum Acceptable Outcome</strong><br>

    <br><br>

    <strong>3. BATNA</strong><br>
    Deal မဖြစ်ရင် ကိုယ့်မှာ ဘာ Alternative ရှိလဲ?

    <br><br>

    <br><br>

    <strong>5. Trade-off</strong><br>
    Discount တစ်ခုတည်းပေးမယ့်အစား
    Volume, Payment Term, Listing, Delivery,
    Promotion Support စတာတွေနဲ့ Trade-off လုပ်ပါ။

    <br><br>

    <strong>Key Rule:</strong><br>
    “Don't negotiate only on price.
    Negotiate on total value.”
    `;

  }

  return `

  <strong>🤖 Manager-Level Answer</strong><br><br>

  ဒီမေးခွန်းကို Manager တစ်ယောက်အနေနဲ့
  <strong>Objective → Current Situation → Data →

  Framework နဲ့ စဉ်းစားပါ။

  နားလည်ပါ။

  <br><br>

  <strong>③ Root Cause</strong><br>
  ဖြစ်နေတဲ့ Problem ရဲ့ အပေါ်ယံအကြောင်းရင်းမဟုတ်ဘဲ

  <br><br>

  <strong>⑤ Review & Improve</strong><br>

    Great Manager = Problem ထပ်မဖြစ်အောင် System တည်ဆောက်သူ

  `;

}

/* ---------- DEMO ACTIVATION ---------- */

function activatePlan(plan){

  const days=plan==="1month" ? 30 : 180;

  const expires=new Date();

  expires.setDate(expires.getDate()+days);

  subscription={
    plan,
    expires:expires.toISOString(),
    activatedAt:new Date().toISOString()
  };

  saveAll();

  updateSubscriptionUI();

  toast(
    plan==="1month"
    ? "⭐ 1 Month Premium activated."
    : "👑 6 Months Premium activated."
  );

  showPage("lessons");
}

function saveSettings(){

  settings.name=
    document.getElementById("setName").value;

  settings.role=
    document.getElementById("setRole").value;

  saveAll();

  toast("✅ Settings saved.");

  render();

}

function resetProgress(){

  if(!confirm("Learning progress ကို reset လုပ်မလား?")){
    return;
  }

  completed=[];

  saveAll();

  toast("Progress reset.");

  render();

}

========================================================= */

function closeModal(){

  document.getElementById("modalBg").classList.remove("show");
}

function closeModalOutside(event){

  if(event.target.id==="modalBg"){
    closeModal();
  }

}

/* =========================================================
   INITIALIZE
========================================================= */

function migrateOldData(){

  const oldCompleted =
    JSON.parse(localStorage.getItem("ABA_V12_COMPLETED") || "null");

  if(
    oldCompleted &&
    Array.isArray(oldCompleted) &&
    completed.length===0
  ){

    completed=oldCompleted;

    saveAll();
  }

}

migrateOldData();

showPage("dashboard");
