<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Aung Business Academy - Professional Business Learning Platform"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>Aung Business Academy</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       APP
       ===================================================== -->

  <div class="app">

    <!-- ===================================================
         SIDEBAR
         =================================================== -->

    <aside class="sidebar" id="sidebar">

      <!-- Logo -->
      <div class="sidebar-header">

        <div class="logo">

          <div class="logo-icon">
            🎓
          </div>

          <div>
            <div class="logo-text">
              Aung Business
            </div>

            <div class="logo-subtitle">
              Academy
            </div>
          </div>

        </div>

      </div>


      <!-- Profile -->
      <div class="sidebar-profile">

        <div class="profile-box">

          <div class="profile-avatar">
            A
          </div>

          <div>

            <div class="profile-name">
              Aung Zar Ni Win
            </div>

            <div class="profile-role">
              Business Manager
            </div>

          </div>

        </div>

      </div>


      <!-- Navigation -->
      <nav class="sidebar-nav">

        <div class="nav-section-title">
          Main
        </div>


        <button
          class="nav-item active"
          data-section="dashboard"
          type="button"
        >
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Dashboard</span>
        </button>


        <button
          class="nav-item"
          data-section="courses"
          type="button"
        >
          <span class="nav-icon">📚</span>
          <span class="nav-text">My Courses</span>
        </button>


        <button
          class="nav-item"
          data-section="lessons"
          type="button"
        >
          <span class="nav-icon">📖</span>
          <span class="nav-text">Lessons</span>
        </button>


        <button
          class="nav-item"
          data-section="progress"
          type="button"
        >
          <span class="nav-icon">📊</span>
          <span class="nav-text">My Progress</span>
        </button>


        <div class="nav-section-title">
          Business
        </div>


        <button
          class="nav-item"
          data-section="sales-manager"
          type="button"
        >
          <span class="nav-icon">💼</span>
          <span class="nav-text">Sales Manager</span>
        </button>


        <button
          class="nav-item"
          data-section="pricing"
          type="button"
        >
          <span class="nav-icon">🧮</span>
          <span class="nav-text">Pricing Calculator</span>
        </button>


        <button
          class="nav-item"
          data-section="reports"
          type="button"
        >
          <span class="nav-icon">📈</span>
          <span class="nav-text">Reports</span>
        </button>


        <div class="nav-section-title">
          AI & Tools
        </div>


        <button
          class="nav-item"
          data-section="ai-business-coach"
          type="button"
        >
          <span class="nav-icon">🤖</span>
          <span class="nav-text">AI Business Coach</span>
        </button>


        <button
          class="nav-item"
          data-section="ai-tools"
          type="button"
        >
          <span class="nav-icon">🛠</span>
          <span class="nav-text">AI Tools</span>
        </button>


        <div class="nav-section-title">
          System
        </div>


        <button
          class="nav-item"
          data-section="settings"
          type="button"
        >
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Settings</span>
        </button>

      </nav>


      <!-- Sidebar Footer -->
      <div class="sidebar-footer">

        <span class="version-badge">
          Aung Business Academy V8.0 Professional
        </span>

      </div>

    </aside>


    <!-- Mobile Overlay -->
    <div
      class="sidebar-overlay"
      id="sidebarOverlay"
    ></div>


    <!-- ===================================================
         MAIN
         =================================================== -->

    <div class="main">

      <!-- Header -->
      <header class="main-header">

        <div style="display:flex;align-items:center;gap:12px;">

          <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            type="button"
            aria-label="Open Menu"
          >
            ☰
          </button>

          <div
            class="header-title"
            id="headerTitle"
          >
            Aung Business Academy
          </div>

        </div>


        <div class="header-right">

          <span class="badge">
            V8.0 Professional
          </span>

        </div>

      </header>


      <!-- =================================================
           DYNAMIC CONTENT
           app.js will render pages here
           ================================================= -->

      <main
        id="app-content"
        class="content"
      ></main>

    </div>

  </div>


  <!-- =====================================================
       MOBILE MENU SCRIPT
       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const sidebar =
          document.getElementById("sidebar");

        const menuButton =
          document.getElementById("mobileMenuBtn");

        const overlay =
          document.getElementById("sidebarOverlay");


        function openMenu() {

          if (!sidebar) return;

          sidebar.classList.add("open");

        }


        function closeMenu() {

          if (!sidebar) return;

          sidebar.classList.remove("open");

        }


        if (menuButton) {

          menuButton.addEventListener(
            "click",
            function (event) {

              event.stopPropagation();

              if (
                sidebar.classList.contains("open")
              ) {

                closeMenu();

              } else {

                openMenu();

              }

            }
          );

        }


        if (overlay) {

          overlay.addEventListener(
            "click",
            closeMenu
          );

        }


        /*
         * Close mobile sidebar after
         * selecting a navigation item.
         */

        document.addEventListener(
          "click",
          function (event) {

            const nav =
              event.target.closest(".nav-item");

            if (nav) {

              setTimeout(
                closeMenu,
                100
              );

            }

          }
        );

      }
    );

  </script>


  <!-- =====================================================
       MAIN APPLICATION
       ===================================================== -->

  <script src="app.js"></script>

</body>
</html>
